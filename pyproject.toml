[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "storycast"
version = "0.1.0"
description = "Evidence-backed news-to-video creator"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "langgraph>=0.3",
  "google-genai>=1.0",
  "huggingface-hub>=0.34",
  "feedparser>=6.0",
  "trafilatura>=2.0",
  "scrapy>=2.12",
  "playwright>=1.51",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "python-dateutil>=2.9",
  "boto3>=1.37",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
