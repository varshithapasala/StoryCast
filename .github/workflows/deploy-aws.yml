name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: storycast-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ vars.AWS_REGION != '' &&
          vars.AWS_DEPLOY_ROLE_ARN != '' &&
          vars.ECR_BACKEND_REPOSITORY != '' &&
          vars.ECR_FRONTEND_REPOSITORY != '' &&
          vars.EC2_INSTANCE_ID != '' &&
          vars.DEPLOY_DIRECTORY != '' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test backend
        run: |
          pip install -e '.[test]'
          pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          NEXT_PUBLIC_API_URL=/api/v1 npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
        run: |
          BACKEND_IMAGE="$REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA"
          FRONTEND_IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$GITHUB_SHA"
          docker build -t "$BACKEND_IMAGE" .
          docker build --build-arg NEXT_PUBLIC_API_URL=/api/v1 -t "$FRONTEND_IMAGE" frontend
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"

      - name: Deploy on EC2 through Systems Manager
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          BACKEND_IMAGE="$REGISTRY/$BACKEND_REPOSITORY:$GITHUB_SHA"
          FRONTEND_IMAGE="$REGISTRY/$FRONTEND_REPOSITORY:$GITHUB_SHA"
          PARAMETERS=$(jq -nc \
            --arg directory "$DEPLOY_DIRECTORY" \
            --arg registry "$REGISTRY" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg region "$AWS_REGION" \
            '{commands:[
              "set -eu",
              ("cd " + ($directory | @sh)),
              "git pull --ff-only",
              ("aws ecr get-login-password --region " + ($region | @sh) + " | docker login --username AWS --password-stdin " + ($registry | @sh)),
              ("BACKEND_IMAGE=" + ($backend | @sh) + " FRONTEND_IMAGE=" + ($frontend | @sh) + " docker compose --env-file .env.production -f docker-compose.prod.yml pull"),
              ("BACKEND_IMAGE=" + ($backend | @sh) + " FRONTEND_IMAGE=" + ($frontend | @sh) + " docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans"),
              "docker image prune -f"
            ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy StoryCast $GITHUB_SHA" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          exit "$WAIT_STATUS"
