name: storycast

x-backend: &backend
  image: ${BACKEND_IMAGE:-storycast-backend:latest}
  build: .
  env_file:
    - ${APP_ENV_FILE:-.env.production}
  environment:
    DATABASE_URL: postgresql+psycopg://storycast:${POSTGRES_PASSWORD}@db:5432/storycast
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    STORAGE_ROOT: /app/storage
  volumes:
    - media:/app/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker-collection:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q collection --loglevel=INFO --concurrency=2

  worker-generation:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q generation --loglevel=INFO --concurrency=2

  worker-rendering:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q rendering --loglevel=INFO --concurrency=1
    shm_size: 2gb

  beat:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO

  frontend:
    image: ${FRONTEND_IMAGE:-storycast-frontend:latest}
    build:
      context: frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres: {}
  redis: {}
  media: {}
  caddy_data: {}
  caddy_config: {}
