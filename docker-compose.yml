name: storycast
x-backend: &backend
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://storycast:storycast@db:5432/storycast
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    STORAGE_ROOT: /app/storage
  volumes:
    - media:/app/storage
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: storycast, POSTGRES_USER: storycast, POSTGRES_PASSWORD: storycast}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U storycast"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  worker-collection:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q collection --loglevel=INFO --concurrency=2
  worker-generation:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q generation --loglevel=INFO --concurrency=2
  worker-rendering:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app worker -Q rendering --loglevel=INFO --concurrency=1
    shm_size: 2gb
  beat:
    <<: *backend
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=INFO
  frontend:
    build:
      context: frontend
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
volumes: {postgres: {}, media: {}}
